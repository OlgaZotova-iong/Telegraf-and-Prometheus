# Telegraf configuration

[global_tags]

# Configuration for telegraf agent
[agent]
  ## ТРЕБОВАНИЕ: частота сбора и отправки метрик каждые 60 секунд
  interval = "60s"
  round_interval = true

  metric_buffer_limit = 10000
  flush_buffer_when_full = true

  collection_jitter = "0s"

  ## ТРЕБОВАНИЕ: отправка также настроена на 60с для соответствия интервалу
  flush_interval = "60s"
  flush_jitter = "0s"

  debug = false
  quiet = false
  hostname = ""

###############################################################################
#                                  OUTPUTS                                    #
###############################################################################

[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "influx"
  precision = "s"
  timeout = "5s"

###############################################################################
#                                  INPUTS                                     #
###############################################################################

# ТРЕБОВАНИЕ: Метрики оперативной памяти
[[inputs.mem]]

# ТРЕБОВАНИЕ: Метрики Swap
[[inputs.swap]]

# ТРЕБОВАНИЕ: Метрики жёсткого диска
[[inputs.disk]]
  ## Игнорируем виртуальные файловые системы докера
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.diskio]]

# ТРЕБОВАНИЕ: Метрики сети
[[inputs.net]]

# Statsd Server (оставляем как был в исходном файле)
[[inputs.statsd]]
  protocol = "udp"
  max_tcp_connections = 250
  tcp_keep_alive = false
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  delete_sets = true
  delete_timings = true
  percentiles = [90]
  metric_separator = "_"
  parse_data_dog_tags = false
  allowed_pending_messages = 10000
  percentile_limit = 1000

# Read metrics about cpu usage
[[inputs.cpu]]
  percpu = true
  totalcpu = true
  fielddrop = ["time_*"]

# Get kernel statistics from /proc/stat
[[inputs.kernel]]

# Get the number of processes and group them by status
[[inputs.processes]]

# Read metrics about system load & uptime
[[inputs.system]]

[[inputs.interrupts]]

[[inputs.linux_sysctl_fs]]
